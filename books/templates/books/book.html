{% load static %}
<h2>Book Details</h2>

<div>
    <div>
        <img src="{{ book.photo }}" alt="Book Image" width="300">
    </div>
    <div>
        <h3>{{ book.title }}</h3>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Category:</strong> {{ book.category }}</p>
        <p><strong>Description:</strong> {{ book.description }}</p>
    </div>
</div>

<div>
    <a href="{% url 'home' %}">Back to Home</a>
</div>
